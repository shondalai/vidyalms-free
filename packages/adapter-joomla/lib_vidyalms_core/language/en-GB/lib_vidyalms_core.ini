LIB_VIDYALMS_CORE="VidyaLMS Core Library"
LIB_VIDYALMS_CORE_XML_DESCRIPTION="The CMS-agnostic VidyaLMS learning engine: courses, enrolment, assessment, progress, completion and credentials. Installed and updated by the VidyaLMS package; com_vidyalms and the VidyaLMS plugins require it."

; Package installer messages. They live here because the library is the first
; child the package installs, so these strings are on disk before any other
; VidyaLMS language file exists.
LIB_VIDYALMS_CORE_PACKAGE_INSTALLED="VidyaLMS installed. Open Components, VidyaLMS to create your first course."
LIB_VIDYALMS_CORE_PACKAGE_UPDATED="VidyaLMS updated."
LIB_VIDYALMS_CORE_PACKAGE_UNINSTALLED="VidyaLMS removed, including its learning tables and scheduled tasks. Notification consent and suppression tables are retained. Check the private-file cleanup result above. The private directory, its keys and ownership metadata, and images/vidyalms remain. Learner uploads remain unless the server owner enabled their removal. Include these retained files in your retention and deletion process; see the adapter README."
LIB_VIDYALMS_CORE_PRIVATE_CLEANUP_COMPLETE="VidyaLMS removed generated reports, certificates and imports from its verified private directory. Learner submissions and attempt files were retained unless VIDYALMS_REMOVE_LEARNER_FILES_ON_UNINSTALL was explicitly set to true. Public images, private keys, ownership metadata and any other files remain."
LIB_VIDYALMS_CORE_PRIVATE_CLEANUP_INCOMPLETE="VidyaLMS could not complete private-file cleanup. Files may remain, including reports, certificates, imports and learner uploads. The private directory was not claimed or replaced. Before deleting anything manually, the server owner must verify this installation owns the configured or automatically selected private directory. See the adapter README."
LIB_VIDYALMS_CORE_PACKAGE_TASKS_CREATED="%d VidyaLMS scheduled task routine(s) created and enabled. Review their cadence under System, Scheduled Tasks."
LIB_VIDYALMS_CORE_PACKAGE_TASKS_DISABLED="The VidyaLMS scheduled task routine(s) %s are present but disabled, and the installer left them exactly as they are. While they stay disabled the jobs they start do not run: certificate renders, notification sends, the entitlement sweep and every scheduled report stay queued. Enable them in System, Scheduled Tasks when you want them to run."

; The delegated organisation console. One capability and no more: holding it
; opens the organisation surface and grants nothing site-wide.
LIB_VIDYALMS_CORE_ORG_ADMIN_GROUP_CREATED="VidyaLMS created the \"%1$s\" user group under Registered and granted it %2$d permission on VidyaLMS. Add a person to that group and give them a role in an organisation, and they reach the organisation console with no administrator login."
LIB_VIDYALMS_CORE_ORG_ADMIN_GROUP_GRANTED="VidyaLMS granted the existing \"%1$s\" user group %2$d permission on VidyaLMS. Nothing already set on that group was changed."
LIB_VIDYALMS_CORE_ORG_ADMIN_GROUP_FOREIGN="VidyaLMS found a user group already called \"%1$s\" (id %2$d) outside the Registered group (its parent is %3$d), so it granted it nothing. That group's members are not this package's to give permissions to. If it is the group you meant, grant it %4$s yourself in Users, Permissions."
LIB_VIDYALMS_CORE_ENTITLEMENT_DIGEST_REPAIRED="VidyaLMS found %d duplicate entitlement grant(s) while giving every grant its own reference digest. The earliest grant of each pair kept its reference and stays active; the later ones were rekeyed and revoked with the reason duplicate_grant_repair, and each is named in the site error log."
