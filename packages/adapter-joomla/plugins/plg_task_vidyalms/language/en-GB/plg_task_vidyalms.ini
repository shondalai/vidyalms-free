PLG_TASK_VIDYALMS="Task - VidyaLMS scheduler"

; Routine: drain the adapter job queue
PLG_TASK_VIDYALMS_DRAIN_TITLE="VidyaLMS: drain job queue"
PLG_TASK_VIDYALMS_DRAIN_DESC="Runs the deferred work the learning engine queued: certificate rendering, report generation, imports, progress recomputation and entitlement sweeps. Run this on a short interval (every minute or two) so queued work completes promptly."
PLG_TASK_VIDYALMS_DRAIN_DONE="VidyaLMS: %1$d job(s) completed, %2$d failed, %3$d skipped, %4$d stale reservation(s) returned to the queue."
PLG_TASK_VIDYALMS_DRAIN_JOB_FAILED="VidyaLMS: job %1$d (%2$s) failed on attempt %3$d: %4$s"
PLG_TASK_VIDYALMS_DRAIN_UNRESOLVED_TYPE="VidyaLMS: nothing is registered for job type \"%1$s\", so job %2$d was left waiting rather than failed; install or enable the extension that provides it and it will run on its own."
PLG_TASK_VIDYALMS_DRAIN_UNRESOLVED="VidyaLMS: %1$d job(s) are waiting for a task type nothing is registered for. They were left in the queue, not failed."

; Routine: expire entitlements
PLG_TASK_VIDYALMS_EXPIRE_TITLE="VidyaLMS: sweep entitlements"
PLG_TASK_VIDYALMS_EXPIRE_DESC="Expires entitlements whose window has closed, suspending any enrolment that loses its last grant, and activates future-dated entitlements whose start date has arrived. Progress is never touched. Run daily, off-peak."
PLG_TASK_VIDYALMS_EXPIRE_DONE="VidyaLMS: expired %1$d entitlement(s), suspended %2$d enrolment(s), activated %3$d."
PLG_TASK_VIDYALMS_EXPIRE_NOTE_LABEL="No options"
PLG_TASK_VIDYALMS_EXPIRE_NOTE_DESC="The sweep reads the entitlement start and expiry dates already stored on each grant, so it needs no configuration. Expiry suspends an enrolment, it never deletes progress, and running the sweep twice changes nothing on the second pass."

; Routine: retention housekeeping
PLG_TASK_VIDYALMS_PRUNE_TITLE="VidyaLMS: prune spent records"
PLG_TASK_VIDYALMS_PRUNE_DESC="Retention housekeeping: deletes idempotency keys past their expiry, job rows that finished long enough ago, and uploaded import archives no import needs any more. Learning data is never touched. Run daily or weekly."
PLG_TASK_VIDYALMS_PRUNE_DONE="VidyaLMS: pruned %1$d idempotency key(s), %2$d finished job row(s) and %3$d import source file(s) (grace %4$d day(s), job retention %5$d day(s), import source retention %6$d day(s))."

; Field labels
PLG_TASK_VIDYALMS_BATCH_SIZE_LABEL="Batch size"
PLG_TASK_VIDYALMS_BATCH_SIZE_DESC="Maximum number of due jobs to process in a single run."
PLG_TASK_VIDYALMS_MAX_ATTEMPTS_LABEL="Maximum attempts"
PLG_TASK_VIDYALMS_MAX_ATTEMPTS_DESC="How many times a failing job is retried before the row is marked failed and left alone."
PLG_TASK_VIDYALMS_BACKOFF_LABEL="Retry delay (minutes)"
PLG_TASK_VIDYALMS_BACKOFF_DESC="How long a failed job waits before it becomes due again."
PLG_TASK_VIDYALMS_STUCK_LABEL="Reservation window (minutes)"
PLG_TASK_VIDYALMS_STUCK_DESC="A run that dies mid-batch leaves rows reserved. Rows still running after this many minutes return to the queue. 0 disables the reclaim."
PLG_TASK_VIDYALMS_GRACE_DAYS_LABEL="Idempotency grace (days)"
PLG_TASK_VIDYALMS_GRACE_DAYS_DESC="Keep expired idempotency keys this many extra days before deleting them. Keys already carry their own expiry, so 0 deletes them as soon as they lapse."
PLG_TASK_VIDYALMS_JOB_DAYS_LABEL="Job retention (days)"
PLG_TASK_VIDYALMS_JOB_DAYS_DESC="Delete completed and failed job rows that finished more than this many days ago."
PLG_TASK_VIDYALMS_IMPORT_SOURCE_DAYS_LABEL="Import source retention (days)"
PLG_TASK_VIDYALMS_IMPORT_SOURCE_DAYS_DESC="Delete an uploaded import archive this many days after the last run that used it finished. Until then the Retry button on a finished import still has its file. A source a queued or running import still needs is never deleted, whatever its age, and a cms-db: source is not a file and is never touched."

; Errors
PLG_TASK_VIDYALMS_KERNEL_MISSING="VidyaLMS is unavailable (com_vidyalms absent, disabled, or not yet configured); the routine was skipped."
PLG_TASK_VIDYALMS_EASYCOMMERCE_TITLE="VidyaLMS: reconcile EasyCommerce access"
PLG_TASK_VIDYALMS_EASYCOMMERCE_DESC="Synchronizes course access from current EasyCommerce orders and subscriptions, retries failures, and discovers missed notifications."
PLG_TASK_VIDYALMS_EASYCOMMERCE_BATCH="Objects per run"
PLG_TASK_VIDYALMS_EASYCOMMERCE_RESULT="EasyCommerce access: %1$d synchronized, %2$d awaiting retry."
PLG_TASK_VIDYALMS_PORTS_MISSING="The VidyaLMS port bundle is not registered, so the job result could not be stored."
PLG_TASK_VIDYALMS_SWEEPS_TITLE="VidyaLMS: start the sweeps"
PLG_TASK_VIDYALMS_SWEEPS_DESC="Queues one turn of every sweep the engine has registered: unlock notices, cohort releases, digest collapses and the notification sweeps. It runs none of them itself; the drain routine does, resolving each type in the engine's own registry. Run it as often as the shortest period any sweep uses."
PLG_TASK_VIDYALMS_SWEEPS_DONE="VidyaLMS: queued %1$d sweep row(s) across %2$d task(s), %3$d skipped."
PLG_TASK_VIDYALMS_SWEEPS_SKIPPED="VidyaLMS: these sweeps could not be started and were skipped: %s."
PLG_TASK_VIDYALMS_SWEEPS_NOTE_LABEL="No options"
PLG_TASK_VIDYALMS_SWEEPS_NOTE_DESC="The routine holds no list of sweeps. It asks the engine which handlers the clock has to start, and each answers its own sharding and its own dedupe key, so a sweep added by another package is started here the day it registers. Queueing the same period twice replaces the pending row rather than sending twice."
