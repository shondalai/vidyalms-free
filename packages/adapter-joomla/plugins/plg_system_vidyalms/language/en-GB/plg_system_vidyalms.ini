PLG_SYSTEM_VIDYALMS="System - VidyaLMS"

; Plugin options
PLG_SYSTEM_VIDYALMS_FIELD_ACTIONLOG_LABEL="Log completions and certificates"
PLG_SYSTEM_VIDYALMS_FIELD_ACTIONLOG_DESC="Write a Joomla action log entry when a learner completes a course and when a certificate is issued. Requires the Action Logs component; the option is ignored when it is not installed."
PLG_SYSTEM_VIDYALMS_FIELD_ACTIONLOG_TITLES_LABEL="Include course titles"
PLG_SYSTEM_VIDYALMS_FIELD_ACTIONLOG_TITLES_DESC="Read the course title for each log entry. Turn this off to save one query per logged event; entries then show the course id only."

; Action log messages ({key} placeholders are filled from the logged event)
PLG_SYSTEM_VIDYALMS_ACTIONLOG_COURSE_COMPLETED="{username} completed the course {title}"
PLG_SYSTEM_VIDYALMS_ACTIONLOG_CERTIFICATE_ISSUED="Certificate {code} was issued to {username} for the course {title}"
