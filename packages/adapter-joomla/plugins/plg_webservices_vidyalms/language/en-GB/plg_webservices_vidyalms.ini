PLG_WEBSERVICES_VIDYALMS="Web Services - VidyaLMS"
PLG_WEBSERVICES_VIDYALMS_XML_DESCRIPTION="Mounts the VidyaLMS /v1 learning API at /api/index.php/v1/vidyalms. Every request is answered by the VidyaLMS core, so the catalogue, enrolment, progress, assessment, assignment and certificate endpoints behave identically to the WordPress build. Requires com_vidyalms; disable this plugin to take the REST surface offline."
