COM_VIDYALMS_ROSTER_ERROR_ORGANISATION_COLUMN="The column \"{column}\" in {file} names an organisation, and a roster file may not. The organisation comes from the console this load was started in, so that a file cannot move people into an organisation you do not administer. Delete the column and upload the file again."
COM_VIDYALMS_ROSTER_ERROR_ORGS_SCOPE="This package carries orgs.csv, which defines the organisation tree. Loading it needs authority over the whole organisation, and yours covers one part of it. Ask an organisation administrator to load the package, or upload one without orgs.csv."
COM_VIDYALMS_ROSTER_ERROR_NO_ORGANISATION="This roster job names no organisation. A roster load takes its organisation from the console it was started in, so start it from the organisation's own import screen."
COM_VIDYALMS_ROSTER_OPTION_INVITE="Invite addresses with no account"
COM_VIDYALMS_ROSTER_OPTION_INVITE_HELP="Off unless you tick it, because a roster load should not mail people nobody asked it to mail. With it on, a person with no account here is invited instead of being reported as skipped, and re-uploading a corrected file does not invite anybody twice."
COM_VIDYALMS_ROSTER_OPTION_ROLE_MAP="Role mapper"
COM_VIDYALMS_ROSTER_OPTION_ROLE_MAP_HELP="Leave empty to use every registered mapper in order. Name one to use only that one, which is what a site with its own role vocabulary does."
COM_VIDYALMS_ROSTER_OPTION_SWEEP="Close memberships this file does not mention"
COM_VIDYALMS_ROSTER_OPTION_SWEEP_HELP="Off by default, and it should usually stay off. A row missing from a file normally means the export was partial, not that the person left. It only ever considers memberships this importer wrote, and it refuses itself if it would close more than the threshold below."
COM_VIDYALMS_ROSTER_OPTION_THRESHOLD="Refuse the sweep above this percentage"
COM_VIDYALMS_ROSTER_OPTION_THRESHOLD_HELP="Ten percent by default. If a sweep would close more of the roster than this, it closes none of it and says so, because a partial export is the usual cause and it is not recoverable."
COM_VIDYALMS_ROSTER_OPTION_TOMBSTONES="Ignore tobedeleted rows"
COM_VIDYALMS_ROSTER_OPTION_TOMBSTONES_HELP="Leave this off. A row marked tobedeleted in a delta file closes that membership, and it is the only deletion instruction this build honours: an absent row never removes anybody. Tick it only to load a file for its additions while leaving its removals for later."
COM_VIDYALMS_IMPORTER_OPTION_PUBLISH="Publish the imported courses"
COM_VIDYALMS_IMPORTER_OPTION_PUBLISH_HELP="Off by default: a migration lands as a draft for a person to review before learners see it."
COM_VIDYALMS_IMPORTER_OPTION_TABLE_PREFIX="Source table prefix"
COM_VIDYALMS_IMPORTER_OPTION_TABLE_PREFIX_HELP="Which Community Quiz install to read, for a database holding more than one. It also names the source in the import map, so two installs are two migrations rather than one overwriting the other."
COM_VIDYALMS_IMPORTER_OPTION_MAX_BYTES="Expanded size limit, in bytes"
