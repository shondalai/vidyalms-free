; VidyaLMS administrator language strings.
;
; Layout of this file:
;   BLOCK 1  component, ACL actions and component options
;   BLOCK 2  administrator screens
;   BLOCK 3  the neutral core catalogue, GENERATED between the markers at the
;            end of this file by build/build.php from packages/core/i18n.
;
; Never edit block 3 by hand: change packages/core/i18n/catalogue.php and run the
; packager. The constants there are what TranslatorPort resolves, so the key
; transform must stay in step with JoomlaTranslator::constantFor().
;
; This is the only catalogue Joomla loads for com_vidyalms in the administrator,
; and JoomlaTranslator loads it from JPATH_ADMINISTRATOR in the site and API
; applications too.

; ============================================================================
; BLOCK 1: component, ACL actions and component options
; ============================================================================

