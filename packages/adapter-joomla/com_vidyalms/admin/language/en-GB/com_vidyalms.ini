COM_VIDYALMS_CONFIG_PLATFORM_LABEL="Platform"
COM_VIDYALMS_CONFIG_PLATFORM_DESC="Settings Joomla itself needs. Learning settings live in the VidyaLMS settings screen."
COM_VIDYALMS_CONFIG_VERIFICATION_BASE_URL_LABEL="Certificate verification URL"
COM_VIDYALMS_CONFIG_VERIFICATION_BASE_URL_DESC="The public address certificates are verified at. The verification code is appended as the last path segment. Leave empty to use this site's own verification route."
COM_VIDYALMS_CONFIG_SITE_BASE_URL_LABEL="Site base URL"
COM_VIDYALMS_CONFIG_SITE_BASE_URL_DESC="This site's own public root, used when a certificate is issued by the scheduler or from the command line, where there is no request to read it from. Leave empty on a site that sets live_site in configuration.php."
COM_VIDYALMS_CONFIG_SITE_LOGO_URL_LABEL="Issuer logo URL"
COM_VIDYALMS_CONFIG_SITE_LOGO_URL_DESC="The organisation logo a certificate and a credential carry. Leave empty and the certificate simply carries no logo. An address written in the VidyaLMS settings screen's issuer record wins over this."
COM_VIDYALMS_CONFIG_CREDENTIAL_BASE_URL_LABEL="Credential base URL"
COM_VIDYALMS_CONFIG_CREDENTIAL_BASE_URL_DESC="The public address a machine-readable credential is fetched from. The credential UUID is appended as the last path segment. Leave empty to use this site's own API mount."
COM_VIDYALMS_CONFIG_STATUS_LIST_BASE_URL_LABEL="Status list base URL"
COM_VIDYALMS_CONFIG_STATUS_LIST_BASE_URL_DESC="Where the credential status list is published. The list UUID is appended as the last path segment. Leave empty to use this site's own API mount."
COM_VIDYALMS_CONFIG_UNSUBSCRIBE_BASE_URL_LABEL="Unsubscribe URL"
COM_VIDYALMS_CONFIG_UNSUBSCRIBE_BASE_URL_DESC="The public address the one-click unsubscribe link points at. The signed token is appended as the last path segment. Leave empty to use this site's own unsubscribe page. It must be an https address: mail with no working unsubscribe mechanism is held back rather than sent."
COM_VIDYALMS_CONFIG_ENVELOPE_DOMAIN_LABEL="Bounce domain"
COM_VIDYALMS_CONFIG_ENVELOPE_DOMAIN_DESC="The domain undeliverable mail is reported back to. Each message is sent with a tagged return address at this domain, which is what ties a bounce arriving hours later to the message that caused it. Leave empty to use the domain of this site's mail from address."
COM_VIDYALMS_CONFIG_CATALOGUE_PAGE_SIZE_LABEL="Catalogue page size"
COM_VIDYALMS_CONFIG_CATALOGUE_PAGE_SIZE_DESC="How many courses one page of the catalogue shows."
COM_VIDYALMS_CONFIG_SELF_ENROLMENT_LABEL="Allow self-enrolment"
COM_VIDYALMS_CONFIG_SELF_ENROLMENT_DESC="Whether a signed-in visitor may enrol themselves on a course that permits it."
COM_VIDYALMS_CONFIG_IMPORT_MAX_UPLOAD_LABEL="Maximum import upload (MB)"
COM_VIDYALMS_CONFIG_IMPORT_MAX_UPLOAD_DESC="The largest archive the Import screen accepts. PHP's own upload_max_filesize and post_max_size still apply, and the screen reports whichever limit is smaller."
COM_VIDYALMS_CONFIG_UPLOAD_MAX_RESOURCE_LABEL="Maximum resource file (MB)"
COM_VIDYALMS_CONFIG_UPLOAD_MAX_RESOURCE_DESC="The largest document or archive the course workbench accepts for a resource lesson. PHP's own upload_max_filesize and post_max_size still apply and are usually the smaller limit. Which file types are accepted is not configurable."
COM_VIDYALMS_CONFIG_UPLOAD_MAX_IMAGE_LABEL="Maximum course image (MB)"
COM_VIDYALMS_CONFIG_UPLOAD_MAX_IMAGE_DESC="The largest course image the workbench accepts. Only raster images are accepted, never SVG, because a course image is stored in a public folder."
COM_VIDYALMS_CONFIG_PRIVATE_STORAGE_PATH_LABEL="Private file folder"
COM_VIDYALMS_CONFIG_PRIVATE_STORAGE_PATH_DESC="Private files use a verified site-specific directory outside public web roots. This legacy option does not select storage. The server owner can define VIDYALMS_PRIVATE_DIR in a trusted bootstrap loaded by all entry points. Existing files require verified ownership and migration. See administrator/components/com_vidyalms/README.md."
COM_VIDYALMS_CONFIG_HTTP_ALLOWLIST_LABEL="Outbound host allowlist"
COM_VIDYALMS_CONFIG_HTTP_ALLOWLIST_DESC="The hosts this site may make an outbound call to. One per line or comma separated. Empty allows nothing, which is deliberate: an installed package can then reach no host you have not named. A leading dot means that host and everything under it, so .example.com covers api.example.com. The proxy and the certificate bundle come from Joomla's own Global Configuration and are not repeated here."
COM_VIDYALMS_CONFIG_HTTP_TIMEOUT_LABEL="Outbound call timeout"
COM_VIDYALMS_CONFIG_HTTP_TIMEOUT_DESC="The longest an outbound call may run, in seconds. A caller may ask for less and never for more, so no installed package can hold a request open past what this site allows."

